[project]
name = "callagent"
version = "0.1.0"
description = "Outbound AI calling agent: learns a business pitch, asks what's missing, dials a lead sheet and closes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.8.0",
    "pipecat-ai[anthropic,deepgram,elevenlabs,silero,twilio,websocket]>=1.12.0",
    "twilio>=9.11",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "phonenumbers>=8.13",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
callagent = "callagent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["callagent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
